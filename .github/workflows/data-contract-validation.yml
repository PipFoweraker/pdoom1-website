name: Data Contract Validation

# Validates the data seams (events + leaderboard) against schemas/ and runs
# semantic integrity/drift checks (scripts/validate_data.py). FAIL-severity breaks
# CI and opens ONE de-duplicated alert issue; WARN-severity is surfaced on the
# /monitoring/ dashboard only (no alert -- conserve attention).

on:
  push:
    branches: [main]
    paths:
      - 'public/data/events.json'
      - 'public/data/ladder-epochs.json'
      - 'public/leaderboard/data/**'
      - 'schemas/**'
      - 'scripts/validate_data.py'
      - 'scripts/ingest_scores.py'
      - 'scripts/test_ingest_scores.py'
      - 'scripts/stamp-league-epoch.py'
      - 'scripts/test-stamp-league-epoch.py'
      - 'scripts/check-league-state.py'
      - 'scripts/test-league-state.py'
      - '.github/workflows/data-contract-validation.yml'
  pull_request:
    paths:
      - 'public/data/events.json'
      - 'public/data/ladder-epochs.json'
      - 'public/leaderboard/data/**'
      - 'schemas/**'
      - 'scripts/validate_data.py'
      - 'scripts/ingest_scores.py'
      - 'scripts/test_ingest_scores.py'
      - 'scripts/stamp-league-epoch.py'
      - 'scripts/test-stamp-league-epoch.py'
      - 'scripts/check-league-state.py'
      - 'scripts/test-league-state.py'
      - '.github/workflows/data-contract-validation.yml'
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC -- catches drift even with no commits
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # A SEPARATE JOB ON PURPOSE.
  #
  # These are code contracts, not live-data observations: they read fixtures in a temp
  # dir and pass or fail deterministically. validate_data.py in the job below reads the
  # REAL board and can legitimately go red on a live-data condition nobody introduced in
  # the PR (today: `board:liveness` NEW orphaned board). If these were steps in that job
  # they would never run on such a day -- a step after a failing step is skipped -- so a
  # genuine ingest-path regression would hide behind an unrelated data alarm.
  #
  # Wired 2026-08-01. Both ran only on someone's laptop before that.
  unit:
    name: Leaderboard code contracts (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Both scripts are otherwise stdlib-only. stamp-league-epoch.py side-loads
      # weekly-league-manager.py, which derives the week with
      # ZoneInfo("Australia/Hobart") -- a real IANA zone, never a fixed offset -- and
      # raises rather than falling back if the tz database is absent.
      - name: Install tz database
        run: pip install --quiet 'tzdata>=2025.1'

      # The read path from stored seed files to the published board. Asserts the RULE
      # (matches the deployed version) rather than a literal -- pinning a literal here
      # is what left this test red across three releases.
      - name: Leaderboard read path
        run: python scripts/test_ingest_scores.py

      # Every weekly record must carry the ladder epoch it belongs to. An unstamped
      # record renders as "unknown", never as "fine" -- everything predating the marker
      # is unmarked too. --check verifies without writing.
      - name: Every weekly record carries its ladder epoch
        run: python scripts/stamp-league-epoch.py --check

      # ...and every defect text says only what its trigger demonstrates. The
      # empty-shell text used to assert "No shipped client ever submitted to this
      # board key" off a bare `if not entries`, which was false for 2026_W33 while
      # the live board under the same blessed key held 6 entries. Forces both the
      # running-week and completed-week states rather than observing the tree.
      - name: Defect stamps claim only what they verify
        run: python scripts/test-stamp-league-epoch.py

      # #351: the site must be able to say which league is OPEN, separately from what
      # is downloadable. The dangerous failure is silent -- a seat filling in
      # league_open from an observation publishes an opening that never happened, which
      # is #297 one gate later -- so the forced-red test runs FIRST and offline
      # (ADR-0002: no guard counts as installed until a RED run of it has been seen).
      - name: Every league-state invariant can still go red
        run: python scripts/test-league-state.py

      # Then the real file. Three outcomes: 0 holds, 1 a claim on the site is wrong
      # (blocking), 2 CANNOT TELL -- the verification stamp has expired. A 2 is NOT a
      # pass and is NOT an incident: the page degrades those lines to `unknown` on its
      # own, so it is surfaced as a warning rather than failing an unrelated PR for a
      # clock. Same treatment as epoch-drift.yml's code 2.
      - name: The league state claims nothing it cannot show
        run: |
          set +e
          python scripts/check-league-state.py | tee league-state.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "## League state"
            echo ""
            echo '```'
            cat league-state.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            echo "::warning::The league-state verification has expired. /leaderboard/ is showing those lines as unknown. Re-run the measurements each block's evidence names, then re-stamp player_facing.verified_utc."
            exit 0
          fi
          exit "$code"

  validate:
    name: Validate data contracts
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation deps
        run: pip install --quiet jsonschema==4.26.0
      - name: Run validation
        id: run
        run: |
          set +e
          python scripts/validate_data.py
          code=$?
          echo "status=$([ $code -eq 0 ] && echo pass || echo fail)" >> "$GITHUB_OUTPUT"
          exit $code

      # Keep the dashboard's health snapshot fresh (schedule/main only).
      #
      # `git add` FIRST, then test the INDEX. `git diff --quiet <path>` cannot see an
      # untracked file, so the add-after-test ordering silently commits nothing while
      # reporting success (see CLAUDE.md workflow trap #1 -- it cost sync-pdoom1-docs
      # months). This path happens to be tracked today, so the old ordering worked;
      # it would have failed silently the first time the artefact was regenerated
      # from scratch or moved.
      #
      # Do NOT "optimise" this to skip commits when only `generated` changed. That
      # timestamp IS the freshness signal /monitoring/ uses to decide whether the
      # snapshot is stale; freezing it would make a dead workflow look healthy.
      - name: Commit integration-health.json
        if: always() && (github.event_name == 'schedule' || github.event_name == 'push')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/integration-health.json
          if git diff --cached --quiet -- public/data/integration-health.json; then
            echo "integration-health.json unchanged -- nothing to commit"
          else
            git commit -m "chore: refresh integration-health.json [skip ci]"
            git push
          fi

  alert:
    name: Alert on failure (de-duplicated)
    # `unit` is in needs so that a code-contract regression found by the 06:00 cron --
    # when no human is watching an Actions tab -- escalates to the same rolling issue.
    # Without it a scheduled unit failure would be a red square nobody is subscribed to.
    needs: [validate, unit]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the single data-contract issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Data contract validation failing';
            const label = 'data-contract';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Automated data-contract validation reported a **FAIL**.',
              '',
              `Run: ${runUrl}`,
              '',
              'A data seam broke its schema, contains encoding corruption, or is self-contradictory --',
              'OR a leaderboard code contract regressed. Check which job is red, then reproduce locally:',
              '',
              '- `python scripts/validate_data.py` (live-data seams)',
              '- `python scripts/test_ingest_scores.py` (leaderboard read path)',
              '- `python scripts/stamp-league-epoch.py --check` (every weekly record carries its epoch)',
              '- `python scripts/test-stamp-league-epoch.py` (defect stamps claim only what they verify)',
              '',
              '_This is a single rolling issue -- it is reused, not duplicated, per run._'
            ].join('\n');

            // Find an existing open issue (reuse, never spam N issues).
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10,
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number,
                body: `Still failing as of ${new Date().toUTCString()}.\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label, 'automation', 'priority:high'],
              });
            }
