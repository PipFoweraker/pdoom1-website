name: Auto-Update Data

# Tier 1 Automation: Fully automatic, runs every 6 hours
# Updates version info and game stats without human approval

on:
  # BACKSTOP, not the mechanism (issue #285). A release published one minute
  # after a scheduled run left pdoom1.com advertising the previous version for
  # up to six hours -- green the whole time, because version.json held a
  # complete and internally consistent record of the WRONG release. Shortening
  # the cron narrows that window without closing it. The release event closing
  # it is the `repository_dispatch` below; this cron stays as the safety net for
  # when the dispatch does not arrive.
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'

  # Fired by pdoom1's `sync-game-version.yml` at release-publish time. That
  # workflow has POSTed `event_type: game_version_sync` at every release to
  # date; this repository had no listener for it, so every one of those
  # dispatches was accepted (the API returns 204 whether or not anything is
  # subscribed) and discarded. Measured 2026-08-07: `gh api
  # "repos/PipFoweraker/pdoom1-website/actions/runs?event=repository_dispatch"`
  # returns an EMPTY list -- no repository_dispatch run has ever executed here.
  #
  # ORDERING HAZARD, measured on the v0.14.0 cut: scripts/update-version-info.py
  # derives `latest_release.platforms` from the release's actual ASSET
  # FILENAMES, and the download page offers exactly what version.json says. If
  # the dispatch can arrive mid-upload, this job can publish a version with
  # missing platforms. The sending side must fire only once assets are attached.
  repository_dispatch:
    types: [game_version_sync]

  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if data is fresh'
        type: boolean
        default: false

permissions:
  contents: write
  # REQUIRED, or the failure handler below 403s and the failure is invisible
  # (CLAUDE.md workflow trap #3). This matters more here than almost anywhere:
  # this workflow writes version.json -- read by the homepage, /game-changelog/
  # and check-platform-claims.py -- and it carries three `continue-on-error`
  # steps, so it can report SUCCESS while having written nothing. A workflow
  # that can be green while broken needs its alarm to actually reach someone.
  #
  # CORRECTED 2026-08-25: the paragraph above described the hazard correctly and
  # then described a mitigation that did not exist. Granting `issues: write` lets
  # the handler run; it does not make the handler REACHABLE. Nothing that any of
  # the three continue-on-error steps did could set the job to failed, and the
  # commit step `exit 0`s early when there is nothing to commit -- so no failure
  # of update-version-info.py or calculate-game-stats.py has ever fired this
  # alarm. Measured: of the 20 most recent runs, the only red ones failed at
  # "Commit changes if any" (e.g. run 32710311391 -- checkout, python, version,
  # stats and log all green, commit red), which is a concurrent-push race, not a
  # data failure. So the alarm was reachable in exactly one way, and it was the
  # way that says nothing about the data.
  #
  # The consequence is the one CLAUDE.md warns about under update-version-info.py:
  # that script "refuses to guess a version" and RAISES instead. A designed
  # refusal is the loudest thing it can do, and it rendered as a green run with a
  # `success` line on /monitoring/. "Adjudicate step outcomes" below is what
  # closes this; the grant here is what lets the alarm it rings be heard.
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Update version information
        id: update-version
        run: |
          echo "Running update-version-info.py..."
          python scripts/update-version-info.py
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Calculate game statistics
        id: update-stats
        run: |
          echo "Running calculate-game-stats.py..."
          python scripts/calculate-game-stats.py
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Log automation run
        id: log-run
        run: |
          echo "Logging automation run to monitoring data..."
          python scripts/log-automation-run.py \
            --job "auto-update-data" \
            --version-status "${{ steps.update-version.outcome }}" \
            --stats-status "${{ steps.update-stats.outcome }}" \
            --trigger "${{ github.event_name }}"
        continue-on-error: true

      - name: Commit changes if any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Auto-Update]"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add public/data/version.json
          # status.json is REWRITTEN by update-version-info.py's sync_status_json(), and
          # was never staged -- so every run recomputed it and every run threw the result
          # away. It froze on 2026-07-17 and the live site told visitors the latest
          # release was v0.11.0 (2025-12-07) while version.json said v0.13.1. The
          # homepage renders BOTH, so a reader saw two answers eight months apart.
          # The script already refuses to write a fallback over it; the missing line was
          # only ever this one.
          git add public/data/status.json || true
          git add public/data/health-check.json || true
          git add public/monitoring/data/ || true

          git commit -m "Auto-update: version info and game stats

          Triggered by: ${{ github.event_name }}
          Version update: ${{ steps.update-version.outcome }}
          Stats update: ${{ steps.update-stats.outcome }}
          Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          [automated]"

          git push

      # Ported from sync-leaderboards.yml ("Fail the job if a sync step failed"),
      # which fixed this exact class: every data step is continue-on-error, so the
      # job could never reach a failed state and the `if: failure()` alert below
      # was unreachable from anything that produces data. continue-on-error is
      # right here -- we want the stats step to run even when the version step
      # died, and both outcomes logged -- but the outcomes have to be adjudicated
      # somewhere. This is that place.
      #
      # PLACEMENT DIFFERS from sync-leaderboards on purpose. There the
      # adjudication precedes the commit, so a failed run commits nothing. Here
      # the commit step is what publishes public/monitoring/data/ -- the record
      # of the failure itself. Ringing the alarm before publishing the evidence
      # would leave /monitoring/ with no entry for the run that went wrong, so
      # this runs AFTER the commit and before the handler.
      #
      # STRICTER THAN THE ORIGINAL in one way: sync-leaderboards tolerates any
      # non-"failure" outcome because its steps are gated by `if:` and legitimately
      # report "skipped". Neither step here is gated, so both MUST produce one of
      # the four real outcomes. An empty value means the step id did not resolve
      # -- a renamed step -- and that is a defect in this file, not a pass.
      - name: Adjudicate step outcomes
        if: always()
        env:
          UPDATE_VERSION: ${{ steps.update-version.outcome }}
          UPDATE_STATS: ${{ steps.update-stats.outcome }}
          LOG_RUN: ${{ steps.log-run.outcome }}
        run: |
          bad=0
          for name in UPDATE_VERSION UPDATE_STATS; do
            outcome="${!name}"
            case "$outcome" in
              success)
                echo "step $name: success"
                ;;
              failure)
                echo "::error::step $name failed -- see its log above"
                bad=1
                ;;
              "")
                echo "::error::step $name produced an EMPTY outcome. The step id in"
                echo "::error::this workflow does not resolve, so nothing was observed."
                bad=1
                ;;
              *)
                echo "::error::step $name reported an unexpected outcome: $outcome"
                bad=1
                ;;
            esac
          done

          # The monitoring logger is NOT adjudicated. It records history; it does
          # not produce the data this site serves. It also refuses (exit 4) when
          # public/monitoring/data/automation-runs.json is unreadable, and that
          # state is repaired by a human editing a file -- blocking on it would
          # make every run of this workflow red until someone did, which is the
          # permanent red CLAUDE.md's severity model forbids. It is loud instead:
          # continue-on-error marks the step failed in the run, and the script
          # emits its own ::error:: annotation.
          if [ "$LOG_RUN" != "success" ]; then
            echo "::warning::monitoring log step reported '${LOG_RUN:-not-run}'."
            echo "::warning::/monitoring/ may be missing this run. Not blocking."
          fi

          if [ "$bad" = "1" ]; then
            echo "At least one data step failed. Failing the job so the alert below"
            echo "actually fires instead of reporting a green update. version.json"
            echo "and status.json may be stale; nothing was guessed."
            exit 1
          fi
          echo "All data steps reported success."

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // De-duplicated alert: one rolling issue (fixed title, no date), comment on repeats.
            const title = '🤖 Auto-Update Data failing';
            const label = 'auto-created';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              '## Auto-Update Data failure',
              '',
              `Version update: ${{ steps.update-version.outcome }} | Stats update: ${{ steps.update-stats.outcome }}`,
              `Run: ${runUrl}`,
              '',
              '_Single rolling issue -- reused, not duplicated, per run._'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number,
                body: `Still failing as of ${new Date().toUTCString()}.\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automation', 'monitoring', label],
              });
            }
