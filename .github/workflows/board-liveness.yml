name: Board liveness (score API)

# Answers ONE question on a schedule: are scores being recorded on a board that no
# visitor to pdoom1.com can see?
#
# A board is keyed by (seed, game_version) -- pdoom1 PR #679. When a submitting client's
# key does not match the board this site publishes, the run is saved to a key nothing
# reads and the player is shown no error. From the outside that is indistinguishable from
# "nobody is playing", and on 2026-07-28 it had already happened: 23 real entries sat on
# (weekly-2026-w0, v0.11.0) and (weekly-2026-w0, v0.12.0) while the site showed an empty
# board. Nothing in this repo had ever read the score API, so nothing could tell.
#
# READ-ONLY. scripts/check-board-liveness.py issues GETs only. This repo is a read-only
# consumer of one score API (pdoom1 PR #679) and must not stand up a second score store.
#
# The game ships ladder-version breaks regularly, so this runs often enough to catch a
# bump within a few hours rather than after a week of apparent silence.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-board-liveness.py'
      - 'public/data/version.json'
      - 'public/leaderboard/data/weekly/current.json'

permissions:
  contents: write
  # Required, or the alert job below 403s and the whole point of this workflow -- being
  # heard -- is lost silently. CLAUDE.md workflow trap #3.
  issues: write

concurrency:
  group: board-liveness
  cancel-in-progress: false

jobs:
  probe:
    name: Probe the live score API
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.probe.outputs.verdict }}
      orphaned: ${{ steps.probe.outputs.orphaned }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe boards
        id: probe
        run: |
          set +e
          python scripts/check-board-liveness.py
          code=$?
          set -e
          echo "probe exit code: $code"
          # 0 = consistent, 1 = orphaned scores found, 2 = API unreachable/unknown.
          verdict=$(python -c "import json;print(json.load(open('public/leaderboard/data/board-liveness.json'))['verdict'])" 2>/dev/null || echo unknown)
          orphaned=$(python -c "import json;print(json.load(open('public/leaderboard/data/board-liveness.json'))['orphaned_entries_total'])" 2>/dev/null || echo 0)
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "orphaned=$orphaned" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit the observation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Board Liveness]"
          # Stage BEFORE testing: board-liveness.json is untracked on its first run and
          # `git diff` cannot see untracked files (CLAUDE.md workflow trap #1).
          git add public/leaderboard/data/board-liveness.json
          if git diff --cached --quiet; then
            echo "No change in board liveness since the last run."
            exit 0
          fi
          git commit -m "chore(board): record live score-API observation"
          git push

      - name: Fail if scores are landing where nobody can see them
        if: steps.probe.outputs.verdict == 'orphaned-scores'
        env:
          ORPHANED: ${{ steps.probe.outputs.orphaned }}
        run: |
          echo "::error::$ORPHANED score entries are recorded on boards this site does not publish."
          exit 1

  alert:
    name: Alert on orphaned scores (de-duplicated)
    needs: probe
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          # Untrusted-shaped values go through env, never spliced into the script body
          # (CLAUDE.md workflow trap #5).
          VERDICT: ${{ needs.probe.outputs.verdict }}
          ORPHANED: ${{ needs.probe.outputs.orphaned }}
        with:
          script: |
            const title = 'Scores are landing on a board nobody can see';
            const label = 'board-liveness';
            const verdict = process.env.VERDICT || 'unknown';
            const orphaned = process.env.ORPHANED || '?';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The live score API probe reported \`${verdict}\`.`,
              '',
              `**${orphaned} score entries** are recorded on board(s) that pdoom1.com does not publish.`,
              'Players finished those runs. No visitor can see them, and no error was shown to anyone.',
              '',
              `Run: ${runUrl}`,
              '',
              'Reproduce locally: `python scripts/check-board-liveness.py`',
              'Details, with counts: `public/leaderboard/data/board-liveness.json`',
              '',
              'A board is keyed by `(seed, game_version)` (pdoom1 PR #679). Either the game must',
              'submit to the board this site publishes, or this site must publish the board the',
              'game submits to.',
              '',
              '**Do not resolve this by re-stamping a version.** That fabricates history.',
              '',
              '_Single rolling issue -- reused, not duplicated, per run._'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10,
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number,
                body: `Still true as of ${new Date().toUTCString()} (${orphaned} orphaned entries).\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label, 'automation', 'priority:high'],
              });
            }
