name: Board liveness (score API)

# Answers ONE question on a schedule: are scores being recorded on a board that no
# visitor to pdoom1.com can see?
#
# A board is keyed by (seed, LADDER EPOCH) -- the client sends "L3", not a build version
# (pdoom1 via issue #151, 2026-07-28). When a submitting client's key does not match the
# board this site publishes, the run is saved to a key nothing reads and the player is
# shown no error. From the outside that is indistinguishable from "nobody is playing",
# and it had already happened: 27 entries from 6 players are now in the permanent anomaly
# archive at public/leaderboard/data/preserved/.
#
# READ-ONLY. scripts/check-board-liveness.py issues GETs only. This repo is a read-only
# consumer of one score API (pdoom1 PR #679) and must not stand up a second score store.
#
# RED ONLY FOR NEW LOSS. The archived orphans stay archived permanently (Pip's ruling),
# so failing on them would leave this workflow red forever -- and a job that is always red
# is a job nobody looks at. Exit 1 (a NEW, unacknowledged orphan) fails. Exit 2 (unknown:
# no epoch artifact yet, or the API unreadable) is reported in the job summary and stays
# green, because "we cannot tell" is not the same as "we are losing scores".
#
# The game ships ladder breaks regularly, so this runs often enough to catch a bump within
# a few hours rather than after a week of apparent silence.

on:
  schedule:
    # HOURLY FOR THE OPENING LEAGUE WINDOW, set 2026-07-31 19:05 AEST.
    #
    # Was '17 */6 * * *'. On league night the seed rolled at ~18:45 and the site kept
    # serving the previous board; the six-hour gap meant a score submitted at 19:00 would
    # not have DISPLAYED until 22:17. Nothing is lost by that -- the API holds it -- but on
    # an opening night "I played and I am not on the board" reads as broken, and that
    # misreading is the exact thing this subsystem exists to prevent.
    #
    # Cost is negligible: ~108 small GETs per run against an API on a VPS already paid for
    # flat, and rsync deploys are incremental. The real constraint was never money.
    #
    # REVERT TO '17 */6 * * *' after the opening weekend (~2026-08-03) unless the hourly
    # cadence proves worth keeping. Left as a dated note rather than a silent permanent
    # change, because an unexplained hourly cron is how cadence creep starts.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-board-liveness.py'
      - 'scripts/publish-live-board.py'
      - 'scripts/test-publish-live-board.py'
      - 'scripts/test-board-escaping.js'
      - 'scripts/test-board-honesty.js'
      - 'public/leaderboard/index.html'
      - 'public/data/version.json'
      - 'public/leaderboard/data/weekly/current.json'
  # PRs get the offline `guards` job ONLY -- see the `if:` on probe/alert below. The
  # probe talks to a live score API and writes to the repo; neither belongs on a PR.
  # Before 2026-08-01 the board guards ran nowhere in CI at all, so a PR could break
  # the leaderboard's HTML escaping or the publisher's refusal paths and merge green.
  pull_request:
    paths:
      - 'scripts/publish-live-board.py'
      - 'scripts/test-publish-live-board.py'
      - 'scripts/test-board-escaping.js'
      - 'scripts/test-board-honesty.js'
      - 'scripts/check-board-liveness.py'
      - 'scripts/board_liveness_summary.py'
      - 'public/leaderboard/**'
      - 'public/data/ladder-epochs.json'
      - '.github/workflows/board-liveness.yml'

permissions:
  contents: write
  # Required, or the alert job below 403s and the whole point of this workflow -- being
  # heard -- is lost silently. CLAUDE.md workflow trap #3.
  issues: write

concurrency:
  group: board-liveness
  cancel-in-progress: false

jobs:
  # OFFLINE. No network, no secrets, no writes -- these are the unit guards on the code
  # that stands between a player's score and a visible board. They run on every event,
  # including pull_request, and they are BLOCKING: each one passes today and a red mark
  # means a real regression.
  #
  # This is the only job on this workflow that runs on a PR. Kept here rather than in a
  # new workflow so that "everything about the board" stays in one file -- a reviewer
  # looking at why a board check fired should not have to find a second place.
  guards:
    name: Board guards (offline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The score API is unauthenticated and validates nothing, so every field it
      # returns is attacker-controlled and every field reaching innerHTML must be
      # escaped. There is exactly ONE escaper on the leaderboard page.
      - name: No API field reaches innerHTML unescaped
        run: node scripts/test-board-escaping.js

      # A board-key mismatch must stay VISIBLE. Reading as "nobody is playing" is the
      # exact failure this whole subsystem exists to prevent, and it already stranded
      # 27 real submissions.
      - name: A board-key mismatch cannot read as "nobody is playing"
        run: node scripts/test-board-honesty.js

      # Forced-failure tests: the publisher must refuse rather than guess, and must
      # never replace a board holding real scores with an empty one on a network blip.
      - name: The publisher refuses rather than guesses
        run: python scripts/test-publish-live-board.py

  probe:
    name: Probe the live score API
    # Never on a PR: it issues ~108 GETs against the live API and the job writes back
    # to the repo. A fork PR could not do either, and a branch PR should not.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.probe.outputs.verdict }}
      # The probe step writes `new_orphans` and `archived` (see the GITHUB_OUTPUT lines
      # below). This previously mapped `steps.probe.outputs.orphaned`, which is never
      # written -- and the alert then read `needs.probe.outputs.new_orphans`, which did
      # not exist either. Both ends wrong, so every alert rendered "**? score entries**"
      # and every follow-up comment said "(? orphaned entries)". An alarm that cannot
      # state its own magnitude is barely an alarm.
      new_orphans: ${{ steps.probe.outputs.new_orphans }}
      archived: ${{ steps.probe.outputs.archived }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe boards
        id: probe
        run: |
          set +e
          python scripts/check-board-liveness.py | tee probe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "probe exit code: $code"
          # Emit the three numbers via a file rather than nested heredocs/command
          # substitution -- indented heredoc terminators and backslash mangling are a
          # documented time sink here (CLAUDE.md, "Encoding gremlin").
          python scripts/board_liveness_summary.py > summary.env
          . ./summary.env
          echo "verdict=$verdict"   >> "$GITHUB_OUTPUT"
          echo "new_orphans=$newn"  >> "$GITHUB_OUTPUT"
          echo "archived=$archn"    >> "$GITHUB_OUTPUT"
          echo "exit_code=$code"    >> "$GITHUB_OUTPUT"

          # Loud every run, in the place a human actually looks.
          {
            echo "## Board liveness: \`$verdict\`"
            echo ""
            echo "- **New (unacknowledged) orphaned entries: $newn** -- non-zero fails this job."
            echo "- Archived anomaly entries: $archn (acknowledged history, never fails)."
            echo ""
            echo '```'
            cat probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Publishing is deliberately part of THIS workflow rather than a second one. The
      # probe already fetched and classified every board; a separate publisher would
      # re-derive the same board key from the same API minutes later and could reach a
      # different answer, which is precisely the split-brain the board key cannot afford.
      #
      # It runs even when the probe found new orphans -- publishing is how an orphan STOPS
      # being one. The failure gate below still fires on the probe's verdict, so a genuine
      # loss is still red; it just gets fixed in the same run that reports it.
      - name: Publish the live board
        id: publish
        run: |
          set +e
          python scripts/publish-live-board.py | tee publish.log
          code=$?
          set -e
          echo "publish exit code: $code"
          # 0 published / 1 nothing publishable / 2 epoch unknown / 3 fetch failed.
          # None of these are failures HERE: 2 and 3 mean the script correctly refused to
          # write rather than guessing, and it leaves the last known-good file untouched.
          # A refusal to publish is the safe outcome, so it must not go red and train
          # anyone to ignore this job.
          {
            echo "## Board publish"
            echo ""
            echo '```'
            cat publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            echo "::warning::No artifact says which ladder epoch is current, so the board was NOT published. Populate current_ladder_epoch in public/leaderboard/data/board-probe-targets.json."
          elif [ "$code" -eq 3 ]; then
            echo "::warning::The score API could not be read. The previously published board is untouched -- not overwritten with an empty one."
          fi

      - name: Commit the observation and the published board
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Board Liveness]"
          # Stage BEFORE testing: these are untracked on their first run and `git diff`
          # cannot see untracked files (CLAUDE.md workflow trap #1).
          git add public/leaderboard/data/board-liveness.json \
                  public/leaderboard/data/leaderboard.json \
                  public/leaderboard/data/published-board.json
          if git diff --cached --quiet; then
            echo "No change in board state since the last run."
            exit 0
          fi
          git commit -m "chore(board): record live score-API observation and publish the live board"
          git push

      # Only NEW loss is red. `epoch-unknown` and `unreachable` are genuine unknowns and
      # stay green (they are already in the job summary above); the archived anomaly is
      # permanent by ruling and must never fail. A job that is red forever gets muted, and
      # then the one run that matters is muted with it.
      - name: Fail only if NEW scores are landing where nobody can see them
        env:
          VERDICT: ${{ steps.probe.outputs.verdict }}
          NEW_ORPHANS: ${{ steps.probe.outputs.new_orphans }}
          ARCHIVED: ${{ steps.probe.outputs.archived }}
        run: |
          echo "verdict=$VERDICT  new=$NEW_ORPHANS  archived=$ARCHIVED"
          if [ "$ARCHIVED" -gt 0 ] 2>/dev/null; then
            echo "::notice::$ARCHIVED archived anomaly entries (acknowledged history, not a failure)."
          fi
          case "$VERDICT" in
            orphaned-scores|unclassifiable)
              echo "::error::$NEW_ORPHANS score entries are recorded on board(s) this site does not publish, and are NOT in the anomaly archive."
              exit 1 ;;
            epoch-unknown)
              echo "::warning::No artifact publishes the current ladder epoch, so this site cannot confirm it publishes the board players submit to. Unknown, not a mismatch."
              ;;
            unreachable|unreadable)
              echo "::warning::Score API state could not be read. Unknown, not empty." ;;
            *)
              echo "Board state consistent." ;;
          esac

  alert:
    name: Alert on NEW orphaned scores (de-duplicated)
    needs: probe
    # Fires only on a real failure, which by the case statement above means a NEW,
    # unacknowledged orphan. The archived anomaly never reaches here.
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          # Untrusted-shaped values go through env, never spliced into the script body
          # (CLAUDE.md workflow trap #5).
          VERDICT: ${{ needs.probe.outputs.verdict }}
          NEW_ORPHANS: ${{ needs.probe.outputs.new_orphans }}
          ARCHIVED: ${{ needs.probe.outputs.archived }}
        with:
          script: |
            const title = 'NEW scores are landing on a board nobody can see';
            const label = 'board-liveness';
            const verdict = process.env.VERDICT || 'unknown';
            const orphaned = process.env.NEW_ORPHANS || '?';
            const archived = process.env.ARCHIVED || '0';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The live score API probe reported \`${verdict}\`.`,
              '',
              `**${orphaned} score entries** are recorded on board(s) that pdoom1.com does not`,
              'publish, and are **not** in the anomaly archive. Players finished those runs.',
              'No visitor can see them, and no error was shown to anyone.',
              '',
              `(Separately, ${archived} entries sit in the permanent anomaly archive. Those are`,
              'acknowledged history and are NOT what this issue is about.)',
              '',
              `Run: ${runUrl}`,
              '',
              'Reproduce locally: `python scripts/check-board-liveness.py`',
              'Details, with counts: `public/leaderboard/data/board-liveness.json`',
              '',
              'A board is keyed by `(seed, ladder_epoch)` — the client sends `L3`, not a build',
              'version. Either the game must submit to the board this site publishes, or this',
              'site must publish the board the game submits to.',
              '',
              '**Do not resolve this by re-stamping a version.** That fabricates history.',
              '',
              '_Single rolling issue -- reused, not duplicated, per run._'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10,
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number,
                body: `Still true as of ${new Date().toUTCString()} (${orphaned} orphaned entries).\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label, 'automation', 'priority:high'],
              });
            }

  # ---------------------------------------------------------------------------------
  # CLOSE THE ROLLING ISSUE WHEN THE CONDITION CLEARS.
  #
  # This did not exist, and its absence is why #149, #204 and #230 all sat open
  # describing conditions that had already resolved. The alert opened an issue or
  # commented "Still true" on it, and NOTHING ever closed it -- so an alarm that was
  # correct once stayed lit forever, and reading it told you nothing about now.
  #
  # That is exactly the failure Pip named this week: he had trained himself to ignore
  # red because the redness never forced him to slow down. A rolling alert with no
  # close path manufactures precisely that.
  #
  # De-dupes the same way the alert does (open + label + exact title), so the two
  # halves cannot disagree about which issue they are managing.
  # ---------------------------------------------------------------------------------
  resolve:
    name: Close the rolling issue when the board is clean
    needs: probe
    if: needs.probe.outputs.verdict == 'live' || needs.probe.outputs.verdict == 'genuinely-empty'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          VERDICT: ${{ needs.probe.outputs.verdict }}
          ARCHIVED: ${{ needs.probe.outputs.archived }}
        with:
          script: |
            const label = 'board-liveness';
            const title = 'NEW scores are landing on a board nobody can see';
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY +
                           '/actions/runs/' + process.env.GITHUB_RUN_ID;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10,
            });
            const found = existing.data.find(i => i.title === title);
            if (!found) { core.info('No open rolling issue to close.'); return; }

            const lines = [
              '**Resolved automatically** -- verdict is `' + process.env.VERDICT + '` as of ' +
                new Date().toUTCString() + '.',
              '',
              'Every populated board outside the anomaly archive is one this site publishes.',
              'The archive still holds ' + process.env.ARCHIVED + ' acknowledged entries; those',
              'are known history, are never failed on, and are not what this issue tracked.',
              '',
              'Run: ' + runUrl,
              '',
              '_Closed by the same workflow that opened it. If the condition recurs a FRESH',
              'issue is filed rather than this one reopened -- so an open issue here always',
              'describes a live condition, never a historical one._',
            ];

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: found.number, body: lines.join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: found.number, state: 'closed', state_reason: 'completed',
            });
            core.info('Closed #' + found.number + '.');
