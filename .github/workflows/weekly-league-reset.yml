name: Weekly League Reset

# CANONICAL weekly league rollover workflow.
# Merged (2026-07-14) with the former weekly-league-rollover.yml, which ran the same
# archive+new-week 9h later every Sunday and caused a double-rollover. This is now the
# single scheduled workflow; it also emits the monitoring log and a failure alert issue
# that the old rollover workflow provided.

on:
  # THURSDAY 14:00 UTC. The league week is anchored to Friday 00:00 in
  # Australia/Hobart (Pip's ruling, 2026-07-28; pdoom1/docs/RELEASE_NOMENCLATURE.md
  # says a Seed roll is "every Fri"). Hobart is UTC+10 in winter and UTC+11 under
  # daylight saving, and GitHub cron is UTC-only with no DST awareness, so this
  # single UTC time lands:
  #     winter  Thu 2026-07-30 14:00Z -> Fri 2026-07-31 00:00 +10:00  (exactly the boundary)
  #     summer  Thu 2026-11-26 14:00Z -> Fri 2026-11-27 01:00 +11:00  (one hour in)
  # i.e. always a Friday in Hobart, and never before the week it opens. The cron
  # is only the trigger; the week is derived from the zone in
  # scripts/weekly-league-manager.py (league_week_start), so a DST change cannot
  # move which week is opened -- only how far into it the run happens.
  # scripts/test-weekly-league-boundary.py parses this cron and fails if it stops
  # agreeing with ROLLOVER_HOUR_UTC / ROLLOVER_CRON_DOW.
  # PARKED 2026-08-24. PARKED-UNTIL: 2026-09-02
  #
  # WHY: this job pushes a league rollover straight to `main` unattended, and the
  # repo's data contract is currently RED (`board:publish` -- the site serves
  # epoch L4 while the live epoch is L5). Pip flies to Singapore Wed 2026-08-26
  # and lands back in Hobart Tue 2026-09-01, so the Friday 2026-08-28 rollover
  # would fire with nobody able to look at what it did. The deploy that follows a
  # push to main runs no tests, so a bad rollover reaches pdoom1.com in ~20s.
  #
  # This is the third option in the "merge #349 or leave it red" choice: the test
  # fix is right and the red was protecting nothing, but merging it alone re-arms
  # THIS cron. Parking the schedule lets the fix land and keeps the unattended
  # publish off until a human is back.
  #
  # The cron value is deliberately left in place, commented, rather than deleted:
  # scripts/test-weekly-league-boundary.py still parses and validates it against
  # ROLLOVER_HOUR_UTC / ROLLOVER_CRON_DOW while parked, so it cannot rot in the
  # dark and be restored wrong.
  #
  # TO RESTORE, all three steps -- CORRECTED 2026-08-24, the first version of
  # this note said "uncomment two lines, that is the whole change" and following
  # it exactly BREAKS THE BUILD:
  #   1. delete the `#` in front of the `schedule:` and `- cron:` lines below;
  #   2. delete the `PARKED` / `PARKED-UNTIL` marker lines above -- otherwise
  #      scripts/generate-metabolism.py exits 2 with "carries the park marker
  #      but still has a schedule. One of the two is a lie";
  #   3. re-run `python scripts/generate-metabolism.py` and commit the page.
  # Step 2 is the one that bites, and it bites in a DIFFERENT workflow
  # (metabolism-map.yml) while scripts/test-weekly-league-boundary.py -- the
  # check built to watch this park -- reports 108/108 PASSED on the same tree.
  # The check nearest the change stays green and the failure surfaces elsewhere,
  # which is the worst shape for whoever is doing the restore.
  #
  # Also restore public/data/clocks.json: delete the league clock's `paused`
  # block. Parking the cron without it left /state-of-doom/ rendering a live
  # countdown to a rollover that would not happen.
  #
  # PARKED-UNTIL is a CLOCK, not a note. On 2026-09-02 the boundary test goes RED
  # with "the park expired" -- closeable by a human either restoring the schedule
  # or re-parking with a new date and a reason. Per CLAUDE.md: an acknowledgement
  # is a state with a clock, and the thing that expires is the ACCEPTANCE, never
  # the finding.
  #
  # schedule:
  #   - cron: '0 14 * * 4'  # Thursday 14:00 UTC = Friday 00:00 (winter) / 01:00 (summer) Hobart

  # Manual trigger for testing or manual league resets
  workflow_dispatch:
    inputs:
      archive_previous:
        description: 'Archive previous week before starting new one'
        type: boolean
        default: true
      force_reset:
        description: 'Force reset even if league is active'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  reset_weekly_league:
    name: Reset Weekly League
    runs-on: ubuntu-latest
    steps:
      - name: League reset banner
        run: |
          echo "🏆 WEEKLY LEAGUE RESET STARTING 🏆"
          echo ""
          echo "⏰ Time: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # This line used to read "New week beginning: Monday $(date -u)" on a
          # run that fired on SUNDAY -- it printed Sunday's date under the word
          # Monday, echoing the same off-by-one the code had (TECH_DEBT A9).
          # No day name is hardcoded here any more: the week actually being
          # opened is printed by the status step below, straight out of
          # weekly-league-manager.py, so the banner cannot disagree with the code.
          echo "👤 Triggered by: ${{ github.event_name }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # The league week is anchored to a real IANA zone (Australia/Hobart), not
      # an offset. ubuntu-latest ships a system tz database so zoneinfo already
      # works here, but installing tzdata makes the dependency explicit and keeps
      # the runner behaving like a Windows box (where it is mandatory).
      - name: Install the IANA timezone database
        run: pip install --quiet tzdata

      # Runs BEFORE anything mutates data. If the run-time -> week mapping has
      # regressed, the correct outcome is a failed rollover (which opens the
      # single failure issue below), not a wrong week published quietly.
      - name: Pin the rollover boundary (TECH_DEBT A9 + the Friday/Hobart anchor)
        run: python scripts/test-weekly-league-boundary.py

      - name: Check current league status
        run: |
          echo "📊 Current league status:"
          python scripts/weekly-league-manager.py --status

      - name: Archive previous week
        id: archive
        if: github.event.inputs.archive_previous != 'false'
        run: |
          echo "📦 Archiving previous week..."
          python scripts/weekly-league-manager.py --archive-week || echo "⚠️  Archive failed (may already be archived)"

      - name: Generate new competitive seed
        run: |
          echo "🎲 Generating new competitive seed for the week..."
          NEW_SEED=$(python scripts/weekly-league-manager.py --generate-seed)
          echo "✅ New seed generated: $NEW_SEED"

      - name: Start new weekly league
        id: new-week
        run: |
          echo "🚀 Starting new weekly league..."

          if [ "${{ github.event.inputs.force_reset }}" = "true" ]; then
            echo "⚠️  Force reset enabled"
            python scripts/weekly-league-manager.py --new-week --force || exit 1
          else
            python scripts/weekly-league-manager.py --new-week || exit 1
          fi

          NEW_WEEK=$(python scripts/weekly-league-manager.py --status | grep "CURRENT_WEEK:" | awk '{print $2}')
          echo "new_week=$NEW_WEEK" >> $GITHUB_OUTPUT
          echo "✅ New weekly league started successfully"

      # Stamps epoch{} onto every weekly record (idempotent) and rebuilds the
      # derived archive index, so the archive page's anomaly section can never
      # drift from the files on disk. See docs/LEAGUE_EPOCH_ANOMALY.md.
      - name: Stamp ladder epoch on weekly records
        run: python scripts/stamp-league-epoch.py

      - name: Verify new league status
        id: verify
        run: |
          echo "🔍 Verifying new league status:"
          python scripts/weekly-league-manager.py --status

          # Check standings (should be empty for new week)
          echo ""
          echo "📊 New week standings:"
          python scripts/weekly-league-manager.py --standings

      - name: Log automation run
        if: always()
        run: |
          echo "Logging league rollover to monitoring..."
          python scripts/log-automation-run.py \
            --job "weekly-league-rollover" \
            --archive-status "${{ steps.archive.outcome }}" \
            --new-week-status "${{ steps.new-week.outcome }}" \
            --verify-status "${{ steps.verify.outcome }}" \
            --new-week-id "${{ steps.new-week.outputs.new_week }}" \
            --trigger "${{ github.event_name }}"
        continue-on-error: true

      - name: Sync game data
        run: |
          echo "🎮 Syncing game data for new week..."
          python scripts/game-integration.py --weekly-sync || echo "⚠️  Game sync failed (non-critical)"
          python scripts/game-integration.py --status

      - name: Commit league reset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Weekly League)"

          # `git diff` cannot see untracked files, and archiving a week CREATES
          # one (archive/<week>_league.json). Stage first, then test the index --
          # see CLAUDE.md "Workflow authoring traps" #1.
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            WEEK_ID=$(python scripts/weekly-league-manager.py --status | grep "CURRENT_WEEK:" | awk '{print $2}')

            git commit -m "Weekly league reset - $WEEK_ID

            - Archived previous week's results
            - Generated new competitive seed
            - Started new weekly league competition
            - Reset standings and statistics
            
            Automated by: weekly-league-reset.yml
            Triggered: $(date -u +'%Y-%m-%d %H:%M UTC')
            New week: $WEEK_ID"
            
            git push
            echo "✅ League reset committed and pushed"
          fi

      - name: League reset summary
        run: |
          WEEK_ID=$(python scripts/weekly-league-manager.py --status | grep "CURRENT_WEEK:" | awk '{print $2}')
          SEED=$(python scripts/weekly-league-manager.py --status | grep "CURRENT_SEED:" | awk '{print $2}')
          
          echo ""
          echo "🎉 WEEKLY LEAGUE RESET COMPLETE! 🎉"
          echo ""
          echo "🏆 New Week: $WEEK_ID"
          echo "🎲 Seed: $SEED"
          echo "⏰ Started: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # No hardcoded end day: the week runs Friday 00:00 -> Thursday 23:59:59
          # Australia/Hobart, and the actual dates are printed by the status step
          # above, out of the code that derives them.
          echo ""
          echo "🔗 Live at: https://pdoom1.com/leaderboard/"
          echo ""
          echo "Next steps:"
          echo "  - Announce new week in Discord"
          echo "  - Share competitive seed with players"
          echo "  - Monitor first scores coming in"

  post_reset_verification:
    name: Post-Reset Verification
    needs: reset_weekly_league
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Wait for changes to propagate
        run: |
          echo "⏳ Waiting 15 seconds for changes to propagate..."
          sleep 15

      - name: Verify league data integrity
        run: |
          echo "🔍 Verifying league data integrity..."
          
          # Check that current.json exists and is valid
          if [ -f "public/leaderboard/data/weekly/current.json" ]; then
            echo "✅ current.json exists"
            python -m json.tool public/leaderboard/data/weekly/current.json > /dev/null
            echo "✅ current.json is valid JSON"
          else
            echo "❌ current.json not found!"
            exit 1
          fi
          
          # Verify league status
          python scripts/weekly-league-manager.py --status
          
          echo "✅ League data verification passed"

      # "Test API endpoints" step removed 2026-07-22 along with scripts/api-server.py.
      # It ran `api-server.py --test || echo "non-critical"` -- a test that had never
      # passed (it crashed on a UnicodeEncodeError before reaching an assertion),
      # with its failure swallowed by design. pdoom1 PR #679 settled that the website
      # is a READ-ONLY consumer of one PHP score API and must not stand up a second
      # score store, so the server it exercised is gone.

  notify_failure:
    name: Notify on Failure
    needs: reset_weekly_league
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Failure notification
        run: |
          echo "❌ WEEKLY LEAGUE RESET FAILED ❌"
          echo ""
          echo "Time: $(date -u +'%Y-%m-%d %H:%M UTC')"
          echo ""
          echo "URGENT ACTION REQUIRED:"
          echo "  1. Check workflow logs for errors"
          echo "  2. Verify league data integrity"
          echo "  3. Manual reset if needed:"
          echo "     python scripts/weekly-league-manager.py --archive-week"
          echo "     python scripts/weekly-league-manager.py --new-week"
          echo "  4. Notify players of delay"
          echo "  5. Update Discord with status"
          echo ""
          echo "Players may already be expecting new league!"
          echo "Time-sensitive - resolve ASAP"

      - name: Create failure alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Weekly League Rollover FAILED - Requires Attention`;
            const body = `
            ## Weekly League Rollover Failed

            **Workflow Run:** ${{ github.run_id }}
            **Timestamp:** ${new Date().toUTCString()}

            ### Required Actions
            1. Review workflow logs: [Link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Check current league status: \`npm run league:status\`
            3. Manual rollover if needed:
               \`\`\`bash
               npm run league:archive
               npm run league:new-week
               \`\`\`
            4. Verify system health: \`npm run integration:test\`

            **Priority:** HIGH - Weekly competition may be stalled
            This issue was automatically created and requires immediate attention.
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'weekly-league', 'bug', 'high-priority', 'auto-created']
            });
