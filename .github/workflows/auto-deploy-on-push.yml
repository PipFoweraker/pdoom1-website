name: Auto-Deploy to DreamHost on Push

# ALL FOUR PRODUCTION DEPLOYS SHARE THIS GROUP. Do not rename it in one file.
# There are four workflows in this repo that run `rsync --delete` from public/ to
# the DreamHost document root, and until 2026-08-10 none of them coordinated with
# any other. On 2026-08-07 at 07:35Z two Auto-Deploy runs on different SHAs
# overlapped by 13 seconds; their rsync STEPS missed each other by 10. Nothing
# collided -- that was runner scheduling, not design.
#
# cancel-in-progress is FALSE on purpose and it is the important half: cancelling a
# half-finished `rsync --delete` against a live document root is strictly worse than
# queueing behind it. Same shape snapshot-analytics.yml and syndicate-content.yml
# already use ("never interrupt a run that may be mid-post").
#
# A guard on three of four is not a guard: weekly-deployment.yml is dispatch-only
# and reads as parked, but a dispatch still performs a real destructive deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'scripts/generate-sitemap.js'
      - '.github/workflows/auto-deploy-on-push.yml'

  # A push made by a workflow using the default GITHUB_TOKEN does NOT trigger another
  # workflow -- the reason this `push` trigger alone is insufficient. (That used to cite
  # CLAUDE.md's "Bot commits do not trigger deploys". PR #260 REWROTE that section,
  # because this very `workflow_run` block is what made it false: bot commits now DO
  # reach production, ~4x/day. The quote was dangling; the reasoning below still holds.)
  # Board Liveness commits the
  # live leaderboard under public/, so without this trigger the board would reach the repo
  # and never reach pdoom1.com -- during a league, that means a board frozen at whatever a
  # human last pushed while players watch it not update. This closes that gap for the one
  # workflow that publishes reader-facing DATA on a schedule.
  # "Auto-Update Data" added for issue #285. It writes public/data/version.json
  # and pushes with the default GITHUB_TOKEN, so -- by the same loop-prevention
  # rule stated above -- its push does NOT fire the `push` trigger. Verified on
  # the v0.14.0 cut: the version.json commit landed at 14:01Z and the deploy
  # that carried it to production was a `workflow_run` off Board liveness, not a
  # `push`. Without this line a release-triggered version.json reaches the
  # repository and then waits for an unrelated workflow to happen to deploy it,
  # which is the second half of the up-to-six-hours window in #285.
  workflow_run:
    workflows: ["Board liveness (score API)", "Auto-Update Data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# The concurrency group this branch proposed here is now the one at the TOP of
# this file, and it is named `production-deploy`. #299 landed the same guard
# across all four production deploys under that name while this branch was open,
# which answers the question this PR's body left to the reviewer ("I do not know
# which of them you consider live"): all four are live, and they share one group.
# Keeping a second block named `deploy-production` would have been a duplicate
# YAML key that silently WON -- this workflow would have serialised against
# nothing while looking guarded. Do not reintroduce it.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deployment Start Notice
        # The commit message is author-controlled text; splicing it into run: lets a
        # message like `macOS & Linux` execute as shell (it did -- exit 127 killed a
        # deploy 2026-07-26). Read it via env and echo as DATA. (github.sha is hex and
        # github.actor is a constrained username, so those stay inline.)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || format('scheduled board publish (via {0})', github.event_name) }}
        run: |
          echo "🚀 AUTO-DEPLOYMENT TRIGGERED 🚀"
          echo "Triggered by push to main branch"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: $COMMIT_MSG"

      - name: Check required secrets
        run: |
          MISSING=0
          for v in DH_HOST DH_USER DH_PATH DH_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              MISSING=1
            else
              echo "✅ Secret $v is set"
            fi
          done
          if [ "${MISSING}" = "1" ]; then
            echo ""
            echo "⚠️  Please configure DreamHost secrets in GitHub repository settings:"
            echo "   Settings > Secrets and variables > Actions"
            echo ""
            echo "Required secrets:"
            echo "   - DH_HOST: DreamHost hostname (e.g., yoursite.dreamhost.com)"
            echo "   - DH_USER: SSH username"
            echo "   - DH_PATH: Remote path (e.g., ~/pdoom1.com)"
            echo "   - DH_SSH_KEY: Private SSH key for authentication"
            echo "   - DH_PORT: SSH port (optional, defaults to 22)"
            exit 1
          fi
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
          DH_SSH_KEY: ${{ secrets.DH_SSH_KEY }}
          DH_PORT: ${{ secrets.DH_PORT }}

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate sitemap
        run: |
          if [ -f "scripts/generate-sitemap.js" ]; then
            echo "📋 Generating sitemap..."
            node scripts/generate-sitemap.js
          else
            echo "⚠️  No sitemap generator found, skipping..."
          fi

      - name: Setup SSH
        env:
          DH_SSH_KEY: ${{ secrets.DH_SSH_KEY }}
        run: |
          echo "🔐 Setting up SSH authentication..."
          mkdir -p ~/.ssh
          echo "$DH_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
          echo "✅ SSH configured"

      - name: Ensure remote path exists
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
          DH_PORT: ${{ secrets.DH_PORT }}
        run: |
          PORT=${DH_PORT:-22}
          echo "📁 Ensuring remote directory exists: ${DH_PATH}"
          ssh -p "$PORT" "${DH_USER}@${DH_HOST}" "mkdir -p '${DH_PATH}'"
          echo "✅ Remote path ready"

      - name: Deploy public/ via rsync
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
          DH_PORT: ${{ secrets.DH_PORT }}
        run: |
          set -euo pipefail
          PORT=${DH_PORT:-22}

          echo "🔄 Deploying to DreamHost via rsync..."
          echo "   Source: ./public/"
          echo "   Destination: ${DH_USER}@${DH_HOST}:${DH_PATH}/"

          # What is NOT shipped, and why, lives in deploy-excludes.txt at the
          # repo root -- one list shared by all four workflows that rsync
          # public/ to production. Read it before changing what deploys, and
          # run scripts/check-deploy-excludes.py after.
          #
          # NOTE: with --delete, an exclude also PROTECTS a path from deletion,
          # so copies already on the server persist and stay publicly fetchable.
          # The list only stops NEW leakage. To reclaim the ~34 MB already
          # there, remove it once by hand (deliberate, not automated):
          #   ssh $DH_USER@$DH_HOST "cd $DH_PATH && rm -rf assets/dump \
          #     assets/image-processing-systems assets/8-bit-effect.gif \
          #     assets/screenshots/*.png"
          rsync -avz --delete \
            --exclude-from=deploy-excludes.txt \
            -e "ssh -p $PORT" \
            public/ "${DH_USER}@${DH_HOST}:${DH_PATH}/"

          echo "✅ Deployment completed successfully!"

      - name: Post-deployment summary
        run: |
          echo ""
          echo "🎉 DEPLOYMENT COMPLETE 🎉"
          echo ""
          echo "✅ Files synced to DreamHost"
          echo "🔗 Site: https://pdoom1.com"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "⏰ Time: $(date -u)"
          echo ""
          echo "🤖 Happy CI/CD gremlining! 🤖"
