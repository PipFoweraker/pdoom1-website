name: Content Honesty

# Guards claims that silently rot into lies -- the prime directive, "never lie to a
# visitor", expressed as CI.
#
# TWO JOBS, TWO SEVERITIES, and the split is the point.
#
#   honesty (BLOCKING)   Every check here is currently true and stays true. A red mark
#                        means a specific reader-facing claim is now false, and the fix
#                        is an edit in this repo.
#   advisory (NEVER RED) Reports that are useful to a reviewer but whose findings are
#                        NOT all defects -- prose drift against a frozen baseline, the
#                        long tail of correct-history version literals, nav/emoji drift.
#                        Rendered into the job summary and explicitly labelled ADVISORY.
#
# CLAUDE.md's rule: a check is blocking-and-true or advisory-and-labelled, never
# red-but-tolerated. "A red test in the suite is worse than no test -- it teaches
# everyone to skip the suite, so the one failure that matters is skipped with it."
# check-stale-facts.py is the worked example: 213 findings, 0 of them HIGH, so the
# blocking step gates on --min-severity HIGH and the full report goes to advisory.
#
# Wired 2026-08-01 (branch ci/wire-the-guards): before that, 10 of the checks CLAUDE.md
# lists as the pre-PR suite ran only if a human remembered.
#
# No secrets, read-only.
#
# CORRECTED 2026-08-03: this header used to say "It does not open issues: it runs only on
# human-driven events, so a red check is seen immediately." Both halves are now false, and
# the reason is worth keeping. The events sync commits with `[skip ci]`
# (.github/workflows/sync-events.yml), so the `push` trigger below NEVER fired on the
# ~1,194 pages that sync writes every day -- the email guard was live for human pushes and
# blind to the only path that generates the pages it exists to check (pdoom1-website#240).
# The real fix is prevention, inside the sync itself. The daily `schedule` here is the
# BACKSTOP for that fix, for the day someone reorders the sync's steps. A cron run has
# nobody watching, so a red one escalates via the `alert` job at the bottom.

on:
  pull_request:
    paths:
      # Reader-facing surfaces. `public/*.html` is listed separately from
      # `public/**/*.html` deliberately -- do not "simplify" it away; the top-level
      # index.html is the single page most of these guards exist for.
      - 'public/*.html'
      - 'public/**/*.html'
      - 'public/assets/js/**'          # analytics.js opt-out, navigation.js, keybinds JS
      - 'public/data/version.json'     # platform availability + changelog derivation
      - 'public/data/keybinds.json'    # the mirror the <kbd> placeholders read
      - 'docs/copy-baseline/**'        # the frozen prose snapshot itself
      - 'scripts/check-platform-claims.py'
      - 'scripts/test-platform-claims.py'
      - 'scripts/check-published-emails.py'
      - 'scripts/test-inherited-email-modes.py'
      - 'scripts/sync/sync-events.py'   # owns EMAIL_PATTERN and residue_scan
      - 'scripts/check-stale-facts.py'
      # The fact-guards social copy is written against. They used to be prose
      # strings with no source; two of them had rotted into lies before anyone
      # looked. content/ is not deployed, so this is the ONLY trigger that sees
      # them -- every other path here is under public/.
      - 'content/campaigns/**'
      - 'scripts/check-campaign-facts.py'
      - 'scripts/test-campaign-facts.py'
      - 'data/acknowledgements.json'
      # The three committing generators and the tests that force their refusals.
      # sync-events.py owns EMAIL_PATTERN and REDACTION_MARKER, which both
      # check-published-emails.py and update-game-data.yml import.
      - 'scripts/sync/sync-events.py'
      - 'scripts/test-sync-events.py'
      - 'scripts/test-sync-events-pii.py'
      - 'scripts/repair-orphan-events.py'
      - 'scripts/test-repair-orphan-events.py'
      - 'scripts/test-severed-contacts.py'
      - 'scripts/update-version-info.py'
      - 'scripts/test-update-version-info.py'
      - 'scripts/health-check.py'
      - 'scripts/test-health-check.py'
      - 'scripts/snapshot-copy.py'
      - 'scripts/snapshot-plausible.py'
      - 'scripts/test-snapshot-plausible.py'
      - 'scripts/test-analytics-optout.js'
      - 'scripts/test-changelog-render.js'
      - 'scripts/test-dashboard-devlog.js'
      - 'scripts/test-manufactured-confidence.js'
      # THE staleness gate, and the pages that call it. A change to either side
      # can silently re-arm the manufactured-confidence class.
      - 'public/assets/js/freshness.js'
      - 'scripts/test-metrics-render.js'
      # /metrics/ renders these two files and nothing else. A snapshot landing
      # without the index rebuilt is exactly the drift --check exists to catch.
      - 'scripts/generate-analytics-index.py'
      - 'public/data/analytics/**'
      - 'scripts/test-download-resolution.js'
      - 'scripts/test-header-consistency.js'
      - 'scripts/sync/sync-keybinds.py'
      # What does and does not ship. A bad exclude 404s an asset in production
      # while every Netlify preview renders it fine -- previews serve public/
      # whole, so only this script can catch it.
      - 'deploy-excludes.txt'
      - 'scripts/check-deploy-excludes.py'
      - 'scripts/make-og-card.py'
      - 'public/assets/og-card.jpg'
      # Art this repo UPLIFTED from pdoom1. `public/assets/**` is here because
      # the register's whole job is to notice a NEW image, and a path filter
      # that only watches the register would never fire on the one commit that
      # matters -- the one that adds art without recording where it came from.
      - 'public/assets/**'
      - 'data/art-register.json'
      - 'data/art-origins.json'
      - 'scripts/build-art-register.py'
      - 'scripts/check-art-staleness.py'
      - 'scripts/test-art-staleness.py'
      - '.github/workflows/auto-deploy-on-push.yml'
      - '.github/workflows/deploy-dreamhost.yml'
      - '.github/workflows/version-aware-deploy.yml'
      - '.github/workflows/weekly-deployment.yml'
      - '.github/workflows/content-honesty.yml'
      - '.github/workflows/snapshot-analytics.yml'
      - '.github/workflows/sync-events.yml'
      # The monitoring logger writes the success rate /monitoring/ publishes, and
      # auto-update-data.yml is the workflow whose alarm that rate depended on.
      # Both were green-by-construction until 2026-08-25; a check that does not
      # trigger on the file it guards is the trap in CLAUDE.md's workflow note #6.
      - 'scripts/log-automation-run.py'
      - 'scripts/test-log-automation-run.py'
      - 'scripts/test-auto-update-adjudication.py'
      - 'scripts/syndication-helpers.js'
      - 'scripts/test-syndication.js'
      - '.github/workflows/auto-update-data.yml'
  push:
    branches: [main]
    paths:
      - 'public/*.html'
      - 'public/**/*.html'
      - 'public/assets/js/**'
      - 'public/data/version.json'
      - 'public/data/keybinds.json'
      - 'docs/copy-baseline/**'
      - 'scripts/check-platform-claims.py'
      - 'scripts/test-platform-claims.py'
      - 'scripts/check-published-emails.py'
      - 'scripts/test-inherited-email-modes.py'
      - 'scripts/sync/sync-events.py'   # owns EMAIL_PATTERN and residue_scan
      - 'scripts/check-stale-facts.py'
      # The fact-guards social copy is written against. They used to be prose
      # strings with no source; two of them had rotted into lies before anyone
      # looked. content/ is not deployed, so this is the ONLY trigger that sees
      # them -- every other path here is under public/.
      - 'content/campaigns/**'
      - 'scripts/check-campaign-facts.py'
      - 'scripts/test-campaign-facts.py'
      - 'data/acknowledgements.json'
      # The three committing generators and the tests that force their refusals.
      - 'scripts/sync/sync-events.py'
      - 'scripts/test-sync-events.py'
      - 'scripts/test-sync-events-pii.py'
      - 'scripts/repair-orphan-events.py'
      - 'scripts/test-repair-orphan-events.py'
      - 'scripts/test-severed-contacts.py'
      - 'scripts/update-version-info.py'
      - 'scripts/test-update-version-info.py'
      - 'scripts/health-check.py'
      - 'scripts/test-health-check.py'
      - 'scripts/snapshot-copy.py'
      - 'scripts/snapshot-plausible.py'
      - 'scripts/test-snapshot-plausible.py'
      - 'scripts/test-analytics-optout.js'
      - 'scripts/test-changelog-render.js'
      - 'scripts/test-dashboard-devlog.js'
      - 'scripts/test-manufactured-confidence.js'
      # THE staleness gate, and the pages that call it. A change to either side
      # can silently re-arm the manufactured-confidence class.
      - 'public/assets/js/freshness.js'
      - 'scripts/test-metrics-render.js'
      # /metrics/ renders these two files and nothing else. A snapshot landing
      # without the index rebuilt is exactly the drift --check exists to catch.
      - 'scripts/generate-analytics-index.py'
      - 'public/data/analytics/**'
      - 'scripts/test-download-resolution.js'
      - 'scripts/test-header-consistency.js'
      - 'scripts/sync/sync-keybinds.py'
      - 'deploy-excludes.txt'
      - 'scripts/check-deploy-excludes.py'
      - 'scripts/make-og-card.py'
      - 'public/assets/og-card.jpg'
      # Art this repo UPLIFTED from pdoom1. `public/assets/**` is here because
      # the register's whole job is to notice a NEW image, and a path filter
      # that only watches the register would never fire on the one commit that
      # matters -- the one that adds art without recording where it came from.
      - 'public/assets/**'
      - 'data/art-register.json'
      - 'data/art-origins.json'
      - 'scripts/build-art-register.py'
      - 'scripts/check-art-staleness.py'
      - 'scripts/test-art-staleness.py'
      - '.github/workflows/auto-deploy-on-push.yml'
      - '.github/workflows/deploy-dreamhost.yml'
      - '.github/workflows/version-aware-deploy.yml'
      - '.github/workflows/weekly-deployment.yml'
      - '.github/workflows/content-honesty.yml'
      - '.github/workflows/snapshot-analytics.yml'
      - '.github/workflows/sync-events.yml'
  schedule:
    # 05:30 UTC daily -- two and a half hours after the 03:00 UTC events sync, and
    # offset from data-contract-validation.yml's 06:00 so the two do not contend.
    # This is the BACKSTOP, not the fix: the sync refuses to publish an address in
    # the first place. This catches the day someone reorders that, and it is the
    # only trigger that sees a `[skip ci]` commit at all.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  honesty:
    name: BLOCKING -- reader-facing claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIRST, because it is the guard on the guard. check-platform-claims.py returns 0
      # before opening a single page whenever every platform in version.json is true --
      # which is the state today -- so its green carries no information on its own. This
      # forces a platform to false and asserts the rejection actually happens.
      - name: The platform guard can still fail (forced-failure test)
        run: python scripts/test-platform-claims.py

      - name: No reachable page claims an unshipped platform
        run: python scripts/check-platform-claims.py

      - name: Download buttons resolve/degrade correctly
        run: node scripts/test-download-resolution.js

      # /game-changelog/ is the player-facing changelog and derives every version at
      # runtime. A hardcoded literal there is a release-day lie.
      - name: The game changelog derives, never hardcodes
        run: node scripts/test-changelog-render.js

      # /dashboard/ carries a SECOND release surface -- the "Recent Development Log"
      # box -- and it is in the nav. Until 2026-08-03 it read a hand-typed file that
      # had frozen nine minor versions back, so the site contradicted itself one click
      # from the changelog it links to. Deriving is not enough on its own: this also
      # forces the freshness gate, because a derived source can stop moving.
      - name: The dashboard development log derives AND is freshness-gated
        run: node scripts/test-dashboard-devlog.js

      # THE SAME DEFECT CLASS, EVERYWHERE ELSE. /dashboard/ grew a freshness gate
      # for its own box; the audit of 2026-08-24 found the class across nine more
      # pages in four shapes: a set assembled from failed reads presented as
      # complete, an absent field coerced to 0, an absent timestamp replaced by
      # `new Date()`, and a figure derived correctly from a file that had stopped
      # moving. Every case in this test FORCES the state -- it is not satisfied by
      # a populated fixture.
      - name: No card renders a reassuring value it did not measure
        run: node scripts/test-manufactured-confidence.js

      # /metrics/ publishes the site's own traffic numbers back to its readers,
      # so every failure mode is a chance to state something false about
      # ourselves. Nothing in this test checks a happy path and stops: it forces
      # a dead fetch, a snapshot carrying `errors`, a non-empty `missing_dates`,
      # a gap and a recorded zero side by side, two snapshots disagreeing, a
      # hostile referrer string, and a string where a number belongs -- and
      # asserts that each one renders as itself rather than as a number.
      - name: The metrics page reports gaps as gaps and never falls back
        run: node scripts/test-metrics-render.js

      # The page reads a derived index of the snapshot archive, because a static
      # host serves no directory listing and probing dates would make a 404
      # indistinguishable from a day with no traffic. --check fails when a
      # snapshot has landed and the index has not been rebuilt, which is the
      # state where the page would quietly stop at an older last day.
      - name: The analytics snapshot index is in step with the snapshots
        run: python scripts/generate-analytics-index.py --check

      # The privacy promise: opt-out works, DNT is honoured, and nothing injects a
      # second tracker (two trackers race and the loser's events vanish).
      - name: Analytics opt-out and no-second-tracker regression
        run: node scripts/test-analytics-optout.js

      # navigation.js is the layout spine -- 24 of 27 hand-written pages delegate
      # their whole header to it -- so "it must ship its own CSS" is a property of
      # the one file every page depends on. It previously injected markup only:
      # pages that happened to carry their own nav rules (the homepage) looked
      # fine, and pages that did not (the blog) rendered the nav as an unstyled
      # block stack over the fold. That is the shape of failure this catches, and
      # it is invisible to anyone checking the homepage.
      #
      # Wired 2026-08-06. It was written 2026-07-23 and had no caller in any
      # workflow, package.json or CLAUDE.md for two weeks -- green the whole time,
      # which is precisely the state CLAUDE.md warns reads as coverage and is not:
      # "a documented suite is a suite a human runs when they remember".
      - name: navigation.js is self-contained (ships its own CSS)
        run: node scripts/test-navigation.js

      # The Manifund campaign link must be UP while the campaign is open and GONE
      # after it closes (2026-09-09), with no human in the loop either way. The
      # honesty risk is the second half: a site inviting people to fund something
      # that has stopped taking money is lying to a visitor, which is the prime
      # directive this workflow exists to enforce.
      #
      # This is a clock, so the test pins a fake Date rather than reading the real
      # one -- a time-dependent test that trusts the wall clock would go green-and
      # -meaningless the day after the campaign closes. It also carries a
      # forced-failure case (mutate the close date into the past, assert the link
      # disappears), so a gate that had been quietly disconnected cannot pass.
      #
      # This step becomes vacuous once the campaign markup is deleted; delete the
      # step with it. Until then it is the only thing checking that the deletion
      # does not need to be remembered.
      - name: The campaign link expires on its own
        run: node scripts/test-campaign-window.js

      # The syndication endpoints are deployed, publicly reachable, and post to
      # real social accounts. This asserts the shared-secret gate is present on
      # every one of them and fails CLOSED when unconfigured -- so a missing
      # credential cannot become an open relay. Same orphan story as above: no
      # caller since 2026-07-23. A security gate that nothing re-checks is a
      # security gate that holds only until someone edits a handler.
      # /issues/ rendered "15 open issues" while the repository held 205 -- the page
      # size of an API request displayed as a count of the world. Same page: the
      # visitor's own clock shown as "last updated", an empty cache publishing
      # "Everything is working smoothly", and 9 of 15 cards being pull requests.
      # The forced-failure test runs FIRST: this check passes now, and a guard seen
      # only in its passing state has not been shown to work.
      - name: The issues surface guard can still fail (forced-failure test)
        run: python scripts/test-issues-surface.py

      - name: Every number /issues/ renders says what it counts
        run: python scripts/check-issues-surface.py

      - name: Syndication endpoints are gated and fail closed
        run: node scripts/test-syndication-auth.js

      # The auth gate above proves nothing can post without a credential. This
      # proves nothing can post an UNATTRIBUTABLE link: content/campaigns/README.md
      # -- "Post a link without UTMs and that attribution is gone permanently.
      # There is no way to reconstruct it afterwards." The generator emitted bare
      # URLs until 2026-08-22 and every queued draft carried one.
      - name: No syndication link leaves untagged
        run: python scripts/test-syndication-utm.py
      # A Bluesky link facet is measured in UTF-8 BYTES. syndicate-bluesky.js
      # used a JavaScript string index, which is the same number for as long as
      # the text before the URL is ASCII -- true of every auto-generated draft,
      # so the defect was live and a test against the real corpus would have
      # passed. This asserts by round trip (cut the claimed byte range out of
      # the encoded post, decode, require the URL back) and re-runs the OLD
      # algorithm to prove the suite can tell the two apart.
      - name: Bluesky link facets are byte offsets (forced-failure test)
        run: node scripts/test-syndication-facets.js

      # post-syndication.py recorded success only if EVERY platform succeeded,
      # so the realistic first live run -- one credential, three 500s -- posted
      # to Bluesky, wrote nothing down, and would have posted again on the next
      # run. Success is now per-platform and written immediately. This forces
      # the partial failure and asserts the second run does not re-post.
      - name: A partly-failed syndication run never re-posts (forced-failure test)
        run: python scripts/test-post-syndication.py

      # The quickstart never mentioned SYNDICATION_TOKEN -- the one value whose
      # absence 503s every endpoint. The required set is derived from the code
      # that reads it, so a new handler fails this the day it lands. The
      # forced-failure test runs FIRST: this check has passed since it was
      # written, and a guard seen only in its passing state has not been shown
      # to work.
      - name: The syndication credential doc can still fail (forced-failure test)
        run: python scripts/test-check-syndication-docs.py

      - name: Every syndication credential is documented, on the right side
        run: python scripts/check-syndication-docs.py

      # scripts/test-syndication.js could not fail. Measured before the rewrite:
      # zero occurrences of process.exit/exitCode/assert/throw, every failure path
      # a catch-and-continue, and one block that printed a generated URL with no
      # assertion at all -- while being exposed as `npm run test:syndication`, the
      # command a human types to check syndication. A test that cannot go red is
      # "a red test is worse than no test" wearing the opposite mask: it reads as
      # coverage to everyone who does not open it.
      - name: The syndication helpers test can actually fail
        run: node scripts/test-syndication.js

      # log-automation-run.py opened with `status = "success"` and downgraded only
      # on an explicit "failure"/"skipped", so a run with NO observations logged a
      # success and incremented success_count. Both callers interpolate
      # `${{ steps.<id>.outcome }}`, which is the EMPTY STRING when a step id does
      # not resolve. /monitoring/ published auto-update-data at 1201/1201 = 100%.
      # This forces the corrupt-log and failed-write refusals and re-runs the old
      # rule to prove the two can be told apart.
      - name: The automation logger never records unearned success (forced-failure test)
        run: python scripts/test-log-automation-run.py

      # auto-update-data.yml granted `issues: write` for a failure handler and
      # explained why: it "can report SUCCESS while having written nothing". But
      # its three continue-on-error steps were the only things that could fail and
      # the commit step exits 0 early, so `if: failure()` was reachable only by a
      # push race -- never by update-version-info.py's designed refusal. This
      # extracts the adjudication step's shell body from the YAML and RUNS it
      # across every outcome combination, including the empty one.
      - name: Auto-Update Data can go red on a data failure (forced-failure test)
        run: |
          pip install --quiet PyYAML
          python scripts/test-auto-update-adjudication.py

      # Third parties' addresses scraped out of paper PDFs must never be served.
      #
      # The forced-failure test runs FIRST, for the same reason the platform one
      # does: check-published-emails.py has passed on every run since the corpus
      # was scrubbed, and a guard seen only in its passing state has not been
      # shown to work. test-sync-events-pii.py forces a redaction regression
      # against a fixture corpus and asserts the generator refuses to write.
      - name: The events-sync PII gate can still refuse (forced-failure test)
        run: python scripts/test-sync-events-pii.py

      # WEB-E1..E4. The 1,000 alignmentforum_* pages are regenerated by nothing,
      # so a repair applied to them can be undone by any future pass over the
      # corpus and no generator would put it back. Forced-failure test first --
      # it drives the real script over a temp corpus and asserts the refusal,
      # the floor and the all-or-nothing write -- then the --check over the real
      # corpus, which is the thing that actually goes red if a page loses a
      # repair.
      - name: The orphan-event repair can still refuse (forced-failure test)
        run: python scripts/test-repair-orphan-events.py

      - name: No orphan event page asserts what it never measured
        run: python scripts/repair-orphan-events.py --check

      # The mode-(d) advisory: an address whose domain was CUT OFF has no TLD,
      # so EMAIL_PATTERN cannot match it and every scanner here reported clean
      # while issues-cache.json served one for ~12 hours on 2026-08-13. This
      # test forces the advisory to fire on the exact text that leaked, and
      # asserts silence on all ten measured false-positive families -- each
      # tested bare AND hard-cut with the truncation marker appended, because
      # the marker is the only thing the rule anchors on.
      - name: The truncation-severed advisory fires, and stays quiet on notation
        run: python scripts/test-severed-contacts.py

      # The three modes pdoom-data fixed on 2026-08-09 (12c0455) and this repo did
      # NOT inherit until 2026-08-15: brace-group notation naming several authors in
      # one address, whitespace inside the domain, and whitespace before the '@'.
      # Nothing was being served in the interval only because the daily sync happened
      # to pull an upstream corpus already cleaned at source -- 'nothing is leaking
      # right now' is not 'nothing can leak', and the distance was one regression.
      #
      # This also pins the property that generalises to the mode nobody has written
      # down yet: with the OLD pattern restored, the INDEPENDENT scanner still sees
      # the leak. Detection and verification are built on different principles so
      # they can disagree, and a disagreement refuses the write.
      - name: The inherited email modes fire, and the two checks can disagree
        run: python scripts/test-inherited-email-modes.py

      - name: No third party's email address is published
        run: python scripts/check-published-emails.py

      # The three generators that publish reader-facing data on committing crons.
      # check-published-emails.py above walks what is ALREADY COMMITTED, so it can only
      # report a leak that has already shipped; these force the failure at the generator,
      # which is the only place it can still be prevented. All stdlib, all offline --
      # each stubs its inputs in a temp dir and asserts the refusal, so none of them
      # needs network, a pdoom1 checkout, or the `requests` this job does not install.
      - name: sync-events redacts PII and no event text can reshape a page
        run: python scripts/test-sync-events.py

      - name: update-version-info refuses to guess, and derives platforms from assets
        run: python scripts/test-update-version-info.py

      - name: health-check publishes no absolute path
        run: python scripts/test-health-check.py

      # --ci, not --check: drift and freshness are only fixable by re-running the sync
      # against a local pdoom1 checkout, which no runner has, so they print as WARN.
      # The blocking half is no-hardcoding -- no page may type a key as a literal --
      # and that IS fixable here. See scripts/sync/sync-keybinds.py.
      - name: No page types a keybind as a literal
        run: python scripts/sync/sync-keybinds.py --ci

      # HIGH only. A HIGH finding is a literal presented as CURRENT: a fallback that
      # ships exactly when the real lookup failed, or a stale date next to "latest".
      # The other ~213 findings are correct history and are reported in the advisory
      # job, not failed on.
      - name: No stale fact is presented as current (HIGH severity)
        run: python scripts/check-stale-facts.py --min-severity HIGH

      # The same failure one layer upstream of the site: the fact-guards that
      # social copy is written against. Until 2026-08-14 they were prose strings
      # with no source and no date, and two of them had become false --
      # "macOS and Linux are NOT yet released" and "remote submission is not live
      # yet" -- while every check in this file stayed green, because nothing read
      # them. A third, the "open source" licence claim, was caught only because a
      # human happened to look (#284).
      #
      # The fix is not the two corrections; it is that each entry now declares HOW
      # IT IS KNOWN (checked / delegated / online / human / durable) and, where it
      # is a claim about the world, WHAT SOURCE ANSWERS IT. This step reads those
      # sources.
      #
      # Forced-failure test FIRST, for the reason test-platform-claims.py runs
      # first: platforms_shipped is green vacuously today -- there is no unshipped
      # platform to find -- so its passing run carries no information on its own.
      - name: The campaign fact-guards can still fail (forced-failure test)
        run: python scripts/test-campaign-facts.py

      # Offline. `online` entries (a pdoom1 issue's state) are deliberately NOT
      # resolved here and print as NOT CHECKED: a bug being fixed in another repo
      # must not turn an unrelated content PR red. The advisory job resolves them.
      - name: No campaign fact-guard has rotted
        run: python scripts/check-campaign-facts.py

      # The analytics-to-git backup must keep failing LOUDLY. Its script only ever runs
      # for real in CI where the API key lives, so its failure paths are unreachable by
      # hand -- this stubs the API and asserts every exit code, plus the workflow
      # contract (stage-before-diff, issues:write, no dispatch input spliced into run:).
      - name: The analytics-to-git backup still fails loudly
        run: python scripts/test-snapshot-plausible.py

      # A deploy exclude is decided at deploy time; an <img src> is written at
      # authoring time, and nothing else connects the two. Netlify previews serve
      # public/ WHOLE, without the excludes, so a preview structurally cannot
      # catch a bad one -- the asset renders in review and 404s in production.
      # Also asserts all four rsync workflows read the one shared list.
      - name: Nothing deployed points at an excluded file
        run: python scripts/check-deploy-excludes.py

      # ART. Two steps, forced-failure test FIRST, because a guard seen only in
      # its passing state has not been shown to work -- and this one is more
      # exposed to that than most: on the real tree its verdict is UNKNOWN with
      # zero findings, which looks exactly like a check that examines nothing.
      #
      # Neither step needs a pdoom1 checkout, and that is a deliberate split.
      # scripts/build-art-register.py --check DOES need one (it re-derives the
      # register from tools/art_review/), so it is NOT wired here for the same
      # reason sync-keybinds.py's drift half is not: blocking on something whose
      # only fix is a local game checkout makes an unrelated content PR
      # un-mergeable until someone with the other repo intervenes. What runs here
      # is the half that is fixable here -- a new image with no record, an asset
      # regenerated in place, deployability drift, an expired human assertion,
      # and an expired acceptance in data/acknowledgements.json. The mirror half
      # reports UNKNOWN, out loud, with the command that would resolve it.
      - name: The art staleness guard can still fail (forced-failure test)
        run: python scripts/test-art-staleness.py

      - name: No uplifted art has gone stale, and unknowns are named as unknown
        run: python scripts/check-art-staleness.py

      - name: Pillow (for the share-card check)
        run: pip install --quiet Pillow

      # Every page declares twitter:card=summary_large_image (~1.91:1). A card
      # that is not 1200x630 gets centre-cropped by the scraper, which is how the
      # laser eyes -- the whole point of the image -- ended up out of frame once.
      - name: The share card is 1200x630 and under budget
        run: python scripts/make-og-card.py --check

  advisory:
    name: ADVISORY -- reported, never blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # snapshot-copy.py --check diffs prose against the frozen baseline, which
          # needs more than a shallow tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # WHY THESE ARE NOT BLOCKING
      # --------------------------
      # snapshot-copy --check          reports 24 pages of prose drift against a
      #                                2026-07-22 baseline. Most of that drift is
      #                                deliberate ("this was false, now it is true").
      #                                It is a REVIEW AID: Pip wants to see copy changes,
      #                                not be blocked by them.
      # check-stale-facts (full)       213 findings, none HIGH. Blog titles naming old
      #                                versions are correct history.
      # test-header-consistency        19/27 today. The nav contract is 22/25 and the
      #                                remainder is content emoji inside frozen prose --
      #                                real drift, but not a lie to a visitor, and
      #                                blocking on it would freeze content work.
      # check-campaign-facts --online  Resolves a pdoom1 ISSUE's state. The subject is
      #                                in another repository, so a red here is not
      #                                closeable by anything in this one -- same
      #                                reasoning epoch-drift.yml uses to skip its
      #                                online half on pull_request. The OFFLINE half
      #                                of the same script IS blocking.
      # check-blessing-consistency     ADVISORY ON PURPOSE AND ONLY FOR NOW. It reports
      #                                7 real findings today, and every one of them is
      #                                true. It is not blocking because the fix is two
      #                                ledger rows that ONLY PIP MAY WRITE -- they record
      #                                who blessed a seed and when, and a seat inferring
      #                                that is the defect (#297). Blocking on a condition
      #                                no seat is permitted to clear would be a permanent
      #                                red, which CLAUDE.md forbids with double force.
      #                                PROMOTE THIS TO BLOCKING once #297's L3 and L4 rows
      #                                are filled. If it is still advisory in a month,
      #                                that is the thing to question, not the finding.
      #
      # Each runs with continue-on-error so the job stays green. Green here means
      # "reported", NOT "clean" -- read the summary.
      - name: Prose drift vs the frozen copy baseline
        continue-on-error: true
        run: |
          {
            echo '## ADVISORY: prose drift vs docs/copy-baseline/'
            echo
            echo 'Reader-facing copy that moved since the 2026-07-22 snapshot. Every diff'
            echo 'should be justifiable as "this was false, now it is true" -- tone and'
            echo 'phrasing rewrites are what this is here to surface for review.'
            echo
            echo '```'
            python scripts/snapshot-copy.py --check 2>&1 | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Full stale-facts report (all severities)
        continue-on-error: true
        run: |
          {
            echo '## ADVISORY: hardcoded facts that will rot'
            echo
            echo 'The BLOCKING job already gated on HIGH. Everything below is MEDIUM/LOW:'
            echo 'mostly correct history. Worth a skim when a release lands.'
            echo
            echo '```'
            python scripts/check-stale-facts.py 2>&1 | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The ONLINE half of the campaign fact-guards. The blocking job runs the same
      # script offline and prints these as NOT CHECKED; this resolves them.
      #
      # Advisory rather than blocking on purpose, and the reason is the one
      # epoch-drift.yml already uses for its PR path: the thing being checked lives
      # in ANOTHER repository. pdoom1#800 closing is good news, and it must not
      # arrive as a red square on an unrelated content PR that nobody here can
      # clear. What it means is that a fact-guard now says the opposite of the
      # truth -- "do not mention the bug reporter, it does not transmit" -- which
      # is a copy decision for a human, on their own schedule.
      - name: Campaign fact-guards -- the online tier
        continue-on-error: true
        run: |
          set +e
          python scripts/check-campaign-facts.py --online | tee campaign-facts.log
          set -e
          {
            echo '## ADVISORY: campaign fact-guards, online tier'
            echo ''
            echo 'Resolves the `online` entries the blocking job printed as NOT CHECKED --'
            echo 'today, whether pdoom1#800 (the F8 reporter that does not transmit) is'
            echo 'still open. A finding here means a fact-guard has inverted: it is now'
            echo 'telling a copywriter to avoid something that has since been fixed.'
            echo 'NEVER blocks -- the subject lives in another repo.'
            echo ''
            echo '```'
            cat campaign-facts.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Header / nav contract drift
        continue-on-error: true
        run: |
          {
            echo '## ADVISORY: header + nav contract'
            echo
            echo 'navigation.js is the single layout spine. Failures here are pages that'
            echo 'have drifted off it, or content emoji in frozen prose.'
            echo
            echo '```'
            node scripts/test-header-consistency.js 2>&1 | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ONLY on the cron. A PR or push failure is already in front of the person who
  # caused it; the 05:30 UTC run is not in front of anyone, and a red square that
  # nobody is subscribed to is the same as no check at all.
  #
  # Single rolling issue, reused not duplicated -- the shape data-contract-validation.yml
  # already uses here. Only trusted GitHub contexts reach the script (CLAUDE.md trap #5).

      - name: ADVISORY -- do the four blessing artefacts agree?
        continue-on-error: true
        run: |
          set +e
          python scripts/check-blessing-consistency.py | tee blessing.log
          set -e
          {
            echo '## ADVISORY: blessing record consistency'
            echo ''
            echo 'Exit 0 agree / 1 disagree / 2 cannot tell. NEVER blocks -- the fix is'
            echo 'two ledger rows only Pip may write. See #297.'
            echo ''
            echo '```'
            cat blessing.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: ADVISORY -- design token drift
        continue-on-error: true
        run: |
          set +e
          python scripts/check-token-drift.py | tee tokens.log
          set -e
          {
            echo '## ADVISORY: design token drift'
            echo ''
            echo 'Pages defining a token-named CSS variable with a value that is not the'
            echo 'token. Mechanical divergence, not a design decision. NEVER blocks --'
            echo 'the sweep that clears it is Step 1 of the token plan and is Pip'"'"'s call.'
            echo ''
            echo '```'
            cat tokens.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  alert:
    name: Alert on scheduled failure (de-duplicated)
    needs: [honesty]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the single content-honesty issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Content honesty checks failing (scheduled run)';
            const label = 'content-honesty';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The daily content-honesty run went red with no human push behind it.',
              '',
              `Run: ${runUrl}`,
              '',
              'A reader-facing claim on pdoom1.com is now false, or a guard regressed.',
              'The one to check first is the email guard: this cron exists because the',
              'events sync commits with `[skip ci]`, so a scheduled red here can mean an',
              'address reached `public/` by a path no push trigger watches.',
              '',
              '- `python scripts/check-published-emails.py`',
              '- `python scripts/test-sync-events-pii.py`',
              '- `python scripts/check-platform-claims.py`',
              '- `python scripts/check-stale-facts.py --min-severity HIGH`',
              '- `python scripts/check-campaign-facts.py`',
              '',
              '_This is a single rolling issue -- it is reused, not duplicated, per run._'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10,
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number,
                body: `Still failing as of ${new Date().toUTCString()}.\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label, 'automation', 'priority:high'],
              });
            }

