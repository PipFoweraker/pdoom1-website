name: Update Game Data Cache

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-game-data.yml'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and cache game data
        run: |
          python - << 'EOF'
          import requests
          import json
          from datetime import datetime

          print("Fetching latest game data...")

          # Fetch version/release data from GitHub API
          try:
              print("Fetching GitHub release data...")
              response = requests.get(
                  'https://api.github.com/repos/PipFoweraker/pdoom1/releases/latest',
                  headers={'Accept': 'application/vnd.github.v3+json'},
                  timeout=10
              )
              response.raise_for_status()
              release_data = response.json()

              # Fetch repository stats
              print("Fetching repository stats...")
              repo_response = requests.get(
                  'https://api.github.com/repos/PipFoweraker/pdoom1',
                  headers={'Accept': 'application/vnd.github.v3+json'},
                  timeout=10
              )
              repo_response.raise_for_status()
              repo_data = repo_response.json()

              # version.json is NOT written here any more. Removed 2026-08-02.
              #
              # This block rebuilt the whole file from scratch on `cron 0 */6 * * *` -- the
              # SAME cron minute as auto-update-data.yml, which runs update-version-info.py.
              # Two writers, one file, alternating. Measured on the real history:
              #
              #   08-01 18:24  HAS platforms      Auto-update: version info and game stats
              #   08-01 18:16  MISSING platforms  chore: Update cached game data [skip ci]
              #   08-01 12:27  HAS platforms
              #   08-01 12:16  MISSING platforms
              #
              # unbroken, four times a day, since the field was introduced.
              #
              # WHY THAT MATTERED. This payload carried no `latest_release.platforms` key.
              # check-platform-claims.py -- the guard that stops the site advertising an OS
              # with no build -- prints "SKIP: version.json has no latest_release.platforms"
              # and returns 0 when the key is absent. So the honesty guard was INERT for
              # roughly half of every day, and its green carried no information at all.
              #
              # It also hardcoded game_stats {23, 5, 10000}: numbers nobody ever measured,
              # re-asserted every six hours, overwriting the honest nulls that
              # calculate-game-stats.py writes with the comment "DO NOT restore a literal
              # here". And it disagreed with the other writer, which used
              # frontier_labs_count 7 against this one's 5 -- two workflows publishing
              # different values for the same public statistic.
              #
              # SOLE OWNER IS NOW scripts/update-version-info.py (via auto-update-data.yml).
              # It is the only writer that derives `platforms` from the release's actual
              # ASSETS rather than asserting them, and it refuses to write a guessed
              # version rather than substituting a literal.
              #
              # This workflow keeps issues-cache.json below, which nothing else produces.

              # Fetch open issues for issues page
              print("Fetching GitHub issues...")
              issues_response = requests.get(
                  'https://api.github.com/repos/PipFoweraker/pdoom1/issues?state=open&per_page=15&sort=updated',
                  headers={'Accept': 'application/vnd.github.v3+json'},
                  timeout=10
              )
              issues_response.raise_for_status()
              issues_data = issues_response.json()

              # THE TRUE TOTALS, and why the page could not have them before.
              #
              # /issues/ used to render `issues.length` as "<N> open issues". That is
              # the PAGE SIZE OF THE REQUEST ABOVE -- per_page=15 -- displayed as a
              # count of the world. On 2026-08-24 the page said "15 open issues" while
              # the repository held 200. Wrong by more than a factor of thirteen, and it
              # was the single sentence a visitor took away.
              #
              # The count cannot be derived from a 15-item sample, so it is fetched.
              # /search/issues gives a total_count and, unlike /issues, can EXCLUDE
              # pull requests -- which matters because /issues returns PRs too, and two
              # of the fifteen cards on that page were PRs rendered under the heading
              # "Known Issues".
              #
              # Failure here must NOT fall back to a plausible number. A None total
              # renders as "unknown" on the page; a substituted one is the defect this
              # whole block exists to remove.
              def _search_total(q):
                  try:
                      r = requests.get(
                          'https://api.github.com/search/issues',
                          params={'q': q, 'per_page': 1},
                          headers={'Accept': 'application/vnd.github.v3+json'},
                          timeout=10)
                      r.raise_for_status()
                      return int(r.json().get('total_count'))
                  except Exception as exc:
                      print(f"::warning::could not resolve total for '{q}': {exc}. "
                            "Writing null -- the page renders this as unknown, never as zero.")
                      return None

              total_open_issues = _search_total(
                  'repo:PipFoweraker/pdoom1 is:issue is:open')
              total_open_prs = _search_total(
                  'repo:PipFoweraker/pdoom1 is:pr is:open')
              print(f"True totals: {total_open_issues} open issues, {total_open_prs} open PRs")

              # DROP PULL REQUESTS from the sample. The /issues endpoint returns both;
              # a PR carries a "pull_request" key and an issue does not.
              _before = len(issues_data)
              issues_data = [i for i in issues_data if not i.get('pull_request')]
              if _before != len(issues_data):
                  print(f"Dropped {_before - len(issues_data)} pull request(s) from the "
                        "issues sample -- /issues returns PRs and this page is not about them")

              # DROP `body`. It is ~70 KB of other people's prose, it is served from
              # pdoom1.com as a static file, and the page renders NONE of it. Keeping
              # it is pure risk with no display value: the 2026-08-02 address leak and
              # the 2026-08-13 severed-address republish both arrived inside a body.
              # Removing it shrinks the file and the attack surface in one edit.
              _body_bytes = sum(len(i.get('body') or '') for i in issues_data)
              for _i in issues_data:
                  _i.pop('body', None)
              print(f"Dropped {_body_bytes} bytes of issue bodies -- rendered by nothing")

              # Untriaged count, so the page can say so instead of defaulting every
              # unlabelled issue to a "normal priority" icon it never earned.
              _untriaged = sum(1 for i in issues_data if not (i.get('labels') or []))

              # Redact third-party email addresses BEFORE the mirror is committed.
              #
              # issues-cache.json is a VERBATIM MIRROR of other people's issue text, and
              # /issues/ renders those bodies to readers. On 2026-08-02 a Co-Authored-By
              # trailer inside a pdoom1 issue body put a live address into this file, which
              # turned check-published-emails.py -- a BLOCKING step in content-honesty.yml --
              # red on main and on every open PR. Nothing in THIS repo could clear it: the
              # only edit that fixes the literal is editing an issue in another repo, and the
              # next run of this workflow would reinstate it. Same shape as the unclearable
              # HIGH that #239 had to unblock, one guard over.
              #
              # An exemption was the wrong answer here. Publishing somebody's address is the
              # exact disclosure that guard exists to prevent (75 academics' addresses were
              # live on 44 event pages until 2026-07-29), and it does not stop being one
              # because a bot copied it instead of a human. So it is fixed where the page is
              # owned, which is what the guard's own failure message tells you to do.
              #
              # redact_pii() is IMPORTED from scripts/sync/sync-events.py rather than
              # reimplemented, so this repo keeps exactly ONE definition of "what an email
              # address looks like" -- the same one check-published-emails.py imports to
              # verify the result. It walks the WHOLE payload rather than a named field
              # list, so a field GitHub adds tomorrow is covered the day it appears, and it
              # substitutes a visible REDACTION_MARKER -- "[email address redacted]", the
              # string pdoom-data also uses (#240) -- rather than deleting, so a reader can
              # tell something was taken out on purpose.
              import importlib.util
              _spec = importlib.util.spec_from_file_location(
                  "sync_events", "scripts/sync/sync-events.py")
              _sync_events = importlib.util.module_from_spec(_spec)
              _spec.loader.exec_module(_sync_events)
              _found = _sync_events.count_emails(issues_data)
              issues_data = _sync_events.redact_pii(issues_data)
              print(f"Redacted {_found} email address(es) from the issues mirror")

              # ADVISORY: truncation-severed addresses, which redact_pii() cannot see.
              #
              # This is not hypothetical and it is not about a third party's typo.
              # On 2026-08-13 this file served "leimeister@un" -- a real address cut
              # mid-domain by pdoom-data's 1,000-character description cap, so it has
              # no TLD and EMAIL_PATTERN cannot match it. The line above printed
              # "Redacted 0 email address(es)" and was telling the truth about what it
              # matched while the address was live on pdoom1.com.
              #
              # It got here because pdoom1#1212 -- the PR that CLOSED the original
              # exposure -- quoted the fragment verbatim to explain the defect, and
              # this job harvests open issue and PR bodies verbatim. The remediation
              # republished the thing it was remediating. It left the published cache
              # only because #1212 merged and dropped out of the state=open window
              # below, which is luck, not a control.
              #
              # ADVISORY RATHER THAN A REDACTION, deliberately: the safe form of this
              # rule (pdoom-data's) is anchored to end-of-string, which a `description`
              # field guarantees and free-form markdown does not. Rewriting on a
              # weaker anchor would fire on prose and on the metric notation these
              # bodies are full of. See the long note in sync-events.py.
              #
              # COUNTS ONLY, never the matched text: this log is public, and printing
              # the match would republish the address a third time.
              _severed = _sync_events.count_severed_contacts(issues_data)
              if _severed:
                  print(f"::warning::{_severed} truncation-severed address shape(s) "
                        "in the issues mirror -- redact_pii() cannot see these. "
                        "Redact the quoting issue/PR body at the source; the next run "
                        "of this job reinstates whatever is still there.")
              else:
                  print("No truncation-severed address shapes in the issues mirror")

              issues_cache = {
                  "issues": issues_data,
                  # `count` is RETAINED for older readers but it is a sample size and
                  # is now named as one everywhere it is consumed. It used to be
                  # len(issues_data) presented as a count of open issues, which cannot
                  # ever disagree with the array -- so it verified nothing while
                  # reading like a total.
                  "count": len(issues_data),
                  "sample_size": len(issues_data),
                  "sample_requested": 15,
                  "sample_sort": "recently updated",
                  "total_open_issues": total_open_issues,
                  "total_open_prs": total_open_prs,
                  "untriaged_in_sample": _untriaged,
                  "bodies_included": False,
                  "last_updated": datetime.utcnow().isoformat(),
                  "_comment": (
                      "issues is a SAMPLE -- the `sample_requested` most recently updated "
                      "open issues, pull requests removed. total_open_issues is the real "
                      "count from /search/issues and may be null, which means UNKNOWN and "
                      "must never render as zero. Bodies are deliberately absent: nothing "
                      "renders them and they are third-party text on a public host."
                  ),
              }

              # THIS FILE IS SERVED FROM pdoom1.com, and it is a verbatim dump of
              # 15 GitHub issue objects -- full bodies, full user objects, written
              # by whoever opened them. Anything address-shaped in an issue body
              # gets republished as a static file on a public site.
              #
              # That is not hypothetical: the cache committed on 2026-08-02 carried
              # `noreply@anthropic.com` out of a Co-Authored-By trailer pasted into
              # an issue body, and scripts/check-published-emails.py was RED on main
              # because of it. Same shape as pdoom1-website#240 item 1 -- a `[skip ci]`
              # bot commit writing into public/ on a path no guard trigger watches.
              #
              # redact_pii() walks the WHOLE structure rather than a named field
              # list, so a field the GitHub API adds tomorrow cannot leak.
              # NOTE 2026-08-04: this read `_sync`, a name that was never bound --
              # two parallel branches each added a redaction block and the union merge
              # kept both bodies but only one importer. It raised
              # `name '_sync' is not defined` and failed this workflow on every
              # 6-hourly run from 2026-08-03. Corrected to the module actually
              # imported above. Kept rather than deleted as redundant: the call above
              # walks the API payload, this one walks the FINAL written object, so a
              # future wrapper field is covered too. Belt and braces on the one file
              # here that is a verbatim public dump of other people's prose.
              issues_cache = _sync_events.redact_pii(issues_cache)
              print(f"✓ Redacted email addresses in issues cache")

              with open('public/data/issues-cache.json', 'w', encoding="utf-8") as f:
                  json.dump(issues_cache, f, indent=2)
              print("✓ Updated issues-cache.json")

              print("\n✓ All data updated successfully!")

          except requests.exceptions.RequestException as e:
              print(f"Error fetching data: {e}")
              print("Keeping existing cached data")
              exit(1)
          except Exception as e:
              print(f"Unexpected error: {e}")
              exit(1)
          EOF

      # RUN INSIDE THE PRODUCER, before the commit step, and that placement is the
      # whole point. This job commits with the skip-CI marker, so a `push`-triggered
      # guard NEVER sees the file it writes -- CLAUDE.md workflow trap #6, the
      # lesson sync-events.yml paid for. A check must take at least one output from
      # inside the system it is checking.
      #
      # It is also why the cache went out for months rendering a per_page value as a
      # count of open issues: content-honesty.yml could not have caught it.
      - name: The issues surface says what it counts
        run: python scripts/check-issues-surface.py

      - name: Check for changes
        id: git-check
        run: |
          # `git add` FIRST. `git diff` cannot see untracked files, so a run whose
          # only output is a NEW file reports "no changes" and commits nothing while
          # reporting success -- CLAUDE.md workflow trap #1, which sync-pdoom1-docs.yml
          # did 4x/day for months. Three sibling workflows were converted to this
          # shape and this one was missed.
          git add -A public/data/
          git diff --cached --quiet -- public/data/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # No longer stages version.json -- this workflow does not write it any
          # more (see the note above). Staging it would re-commit whatever the
          # checkout happened to contain and reintroduce the race by the back door.
          git add public/data/issues-cache.json
          git commit -m "chore: Update cached game data [skip ci]

          Auto-updated by GitHub Actions
          - Latest release info
          - Repository stats
          - Open issues cache

          Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
